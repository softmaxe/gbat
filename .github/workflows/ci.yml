name: CI

on:
  # Pull requests only: "Check" is a required check with the up-to-date policy, and main
  # only takes squash merges, so every commit on main has already passed it.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup installs the toolchain pinned in rust-toolchain.toml on first use.
      - name: Format
        if: runner.os == 'macOS'
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # Linux is installed from source; verify linking and startup without HID access.
      - name: Build and smoke-test Linux CLI
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cargo build --release --locked
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          test "$(./target/release/gbat --version)" = "gbat $version"

  check:
    name: Check
    # Keep the existing required check, and fail even if validation was skipped.
    if: always()
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both platforms to pass
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = success
