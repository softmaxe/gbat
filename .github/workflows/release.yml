name: Build and release

on:
  push:
    tags:
      - "v*.*.*"
  # Manual runs build and upload the archive as a workflow artifact only.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    name: Build aarch64-apple-darwin
    # macos-15 is arm64, so a native build produces the only target gbat ships.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TARGET: aarch64-apple-darwin
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step here uses git, and cargo build scripts are third-party code
          # that would otherwise be able to read the token out of .git/config.
          persist-credentials: false

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          tag=""
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
            test "$tag" = "v$version" || {
              echo "Tag $tag does not match Cargo version $version" >&2
              exit 1
            }
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test and build
        run: |
          set -euo pipefail
          cargo test --locked
          cargo build --release --locked

      - name: Verify and package binary
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          binary="target/release/gbat"

          test "$(lipo -archs "$binary")" = "arm64"
          minos="$(otool -l "$binary" | awk '$1 == "minos" { print $2; exit }')"
          test "$minos" = "$MACOSX_DEPLOYMENT_TARGET" || {
            echo "Expected minimum macOS $MACOSX_DEPLOYMENT_TARGET, got $minos" >&2
            exit 1
          }
          test "$("$binary" --version)" = "gbat $VERSION"

          package_dir="$RUNNER_TEMP/package"
          mkdir -p "$package_dir" dist
          install -m 0755 "$binary" "$package_dir/gbat"
          install -m 0644 LICENSE "$package_dir/LICENSE"

          archive="gbat-v$VERSION-$TARGET.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "dist/$archive" -C "$package_dir" gbat LICENSE
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          echo "sha256=$(awk '{ print $1 }' "dist/$archive.sha256")" >> "$GITHUB_OUTPUT"

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ env.TARGET }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      # With assets, gh creates a draft, uploads, then publishes, so a failed
      # upload never leaves a public release without its archive.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes --title "$TAG"

  tap:
    name: Test formula and update Homebrew tap
    if: github.event_name == 'push'
    needs:
      - build
      - release
    runs-on: macos-15
    timeout-minutes: 20
    concurrency:
      group: homebrew-tap-gbat
      cancel-in-progress: false
    env:
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
      SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - name: Generate formula
        run: |
          set -euo pipefail
          archive="gbat-v$VERSION-aarch64-apple-darwin.tar.gz"
          cat > "$RUNNER_TEMP/gbat.rb" <<EOF
          class Gbat < Formula
            desc "Read Logitech GPW2 battery status on macOS"
            homepage "https://github.com/softmaxe/gbat"
            license "AGPL-3.0-only"

            depends_on arch: :arm64
            depends_on macos: :big_sur

            on_macos do
              on_arm do
                url "https://github.com/softmaxe/gbat/releases/download/$TAG/$archive"
                sha256 "$SHA256"
              end
            end

            def install
              bin.install "gbat"
              prefix.install "LICENSE"
            end

            test do
              assert_equal "gbat #{version}", shell_output("#{bin}/gbat --version").strip
            end
          end
          EOF

      # Runs before the tap checkout so no Homebrew step can read the tap token.
      - name: Install and test formula
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          brew tap-new softmaxe/release-test
          install -m 0644 "$RUNNER_TEMP/gbat.rb" "$(brew --repository softmaxe/release-test)/Formula/gbat.rb"

          brew audit --strict softmaxe/release-test/gbat
          brew install softmaxe/release-test/gbat
          brew test softmaxe/release-test/gbat

      - name: Check out Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: softmaxe/homebrew-tap
          ref: main
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Commit and push formula
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          install -m 0644 "$RUNNER_TEMP/gbat.rb" Formula/gbat.rb
          git add Formula/gbat.rb
          if git diff --cached --quiet; then
            echo "Formula/gbat.rb is already current"
            exit 0
          fi
          git commit -m "chore: update gbat to $VERSION"
          git push origin HEAD:main
