name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  validate:
    name: Validate release tag
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Match tag and Cargo version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tags must match vMAJOR.MINOR.PATCH: $tag" >&2
            exit 1
          fi

          version="${BASH_REMATCH[1]}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$cargo_version" != "$version" ]]; then
            echo "Cargo version $cargo_version does not match tag $tag" >&2
            exit 1
          fi

          test -f LICENSE
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            machine_arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            machine_arch: x86_64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup target add "${{ matrix.target }}" --toolchain "$RUST_TOOLCHAIN"
          rustup default "$RUST_TOOLCHAIN"
          rustc --version --verbose
          cargo --version

      - name: Verify native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          actual_arch="$(uname -m)"
          test "$actual_arch" = "${{ matrix.machine_arch }}" || {
            echo "Expected ${{ matrix.machine_arch }} runner, got $actual_arch" >&2
            exit 1
          }

      - name: Test and build
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --target "${{ matrix.target }}"
          cargo build --release --locked --target "${{ matrix.target }}"

      - name: Verify and package binary
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
          EXPECTED_ARCH: ${{ matrix.machine_arch }}
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/gbat"
          test -x "$binary"

          binary_archs="$(lipo -archs "$binary")"
          test "$binary_archs" = "$EXPECTED_ARCH" || {
            echo "Expected $EXPECTED_ARCH binary, got $binary_archs" >&2
            exit 1
          }

          minos="$(otool -l "$binary" | awk '$1 == "minos" { print $2; exit }')"
          test "$minos" = "$MACOSX_DEPLOYMENT_TARGET" || {
            echo "Expected minimum macOS $MACOSX_DEPLOYMENT_TARGET, got $minos" >&2
            exit 1
          }

          test "$("$binary" --version)" = "gbat $VERSION"

          package_dir="$RUNNER_TEMP/package-$TARGET"
          dist_dir="$RUNNER_TEMP/dist-$TARGET"
          mkdir -p "$package_dir" "$dist_dir"
          install -m 0755 "$binary" "$package_dir/gbat"
          install -m 0644 LICENSE "$package_dir/LICENSE"

          archive="gbat-v$VERSION-$TARGET.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$dist_dir/$archive" -C "$package_dir" gbat LICENSE
          (
            cd "$dist_dir"
            shasum -a 256 "$archive" > "$archive.sha256"
            shasum -a 256 -c "$archive.sha256"
          )

          archive_entries="$(tar -tzf "$dist_dir/$archive" | LC_ALL=C sort)"
          expected_entries="$(printf '%s\n' LICENSE gbat | LC_ALL=C sort)"
          test "$archive_entries" = "$expected_entries"

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/dist-${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify release files
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          expected_files="$(printf '%s\n' \
            "gbat-v$VERSION-aarch64-apple-darwin.tar.gz" \
            "gbat-v$VERSION-aarch64-apple-darwin.tar.gz.sha256" \
            "gbat-v$VERSION-x86_64-apple-darwin.tar.gz" \
            "gbat-v$VERSION-x86_64-apple-darwin.tar.gz.sha256" | LC_ALL=C sort)"
          actual_files="$(find dist -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)"
          test "$actual_files" = "$expected_files" || {
            echo "Unexpected release file set:" >&2
            printf '%s\n' "$actual_files" >&2
            exit 1
          }
          (
            cd dist
            sha256sum -c -- *.sha256
          )

      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Create draft and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            test "$is_draft" = "true" || {
              echo "Release $TAG is already published and will not be overwritten" >&2
              exit 1
            }
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --generate-notes \
              --title "$TAG"
          fi

          gh release upload "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          expected_count="$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')"
          actual_count="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          test "$actual_count" = "$expected_count"

          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest

  formula:
    name: Generate Homebrew formula
    needs:
      - validate
      - release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate formula
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          arm_archive="gbat-v$VERSION-aarch64-apple-darwin.tar.gz"
          intel_archive="gbat-v$VERSION-x86_64-apple-darwin.tar.gz"
          arm_sha="$(sha256sum "dist/$arm_archive" | awk '{ print $1 }')"
          intel_sha="$(sha256sum "dist/$intel_archive" | awk '{ print $1 }')"

          mkdir -p formula
          cat > formula/gbat.rb <<EOF
          class Gbat < Formula
            desc "Read Logitech GPW2 battery status on macOS"
            homepage "https://github.com/softmaxe/gbat"
            license "AGPL-3.0-only"

            depends_on macos: :big_sur

            on_macos do
              on_arm do
                url "https://github.com/softmaxe/gbat/releases/download/$TAG/$arm_archive"
                sha256 "$arm_sha"
              end

              on_intel do
                url "https://github.com/softmaxe/gbat/releases/download/$TAG/$intel_archive"
                sha256 "$intel_sha"
              end
            end

            def install
              bin.install "gbat"
              prefix.install "LICENSE"
            end

            test do
              assert_equal "gbat #{version}", shell_output("#{bin}/gbat --version").strip
            end
          end
          EOF

          ruby -c formula/gbat.rb

      - name: Upload candidate formula
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-formula
          path: formula/gbat.rb
          if-no-files-found: error
          retention-days: 30

  formula-test:
    name: Test formula on ${{ matrix.machine_arch }}
    needs:
      - validate
      - formula
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            machine_arch: arm64
          - runner: macos-15-intel
            machine_arch: x86_64
    steps:
      - name: Download candidate formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-formula
          path: formula

      - name: Install and test formula
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine_arch }}"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          brew tap-new softmaxe/release-test
          test_tap="$(brew --repository softmaxe/release-test)"
          install -m 0644 formula/gbat.rb "$test_tap/Formula/gbat.rb"

          brew audit --strict softmaxe/release-test/gbat
          brew install softmaxe/release-test/gbat
          brew test softmaxe/release-test/gbat
          test "$(gbat --version)" = "gbat $VERSION"

          installed_archs="$(lipo -archs "$(brew --prefix gbat)/bin/gbat")"
          test "$installed_archs" = "${{ matrix.machine_arch }}"

  tap-sync:
    name: Update Homebrew tap
    needs:
      - validate
      - release
      - formula
      - formula-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: homebrew-tap-gbat
      cancel-in-progress: false
    steps:
      - name: Check out Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: softmaxe/homebrew-tap
          ref: main
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Download tested formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-formula
          path: formula

      - name: Commit and push formula
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          cd homebrew-tap

          if [[ -f Formula/gbat.rb ]]; then
            current_version="$(sed -n 's/^[[:space:]]*version "\([^"]*\)"/\1/p' Formula/gbat.rb | head -n 1)"
            if [[ -z "$current_version" ]]; then
              current_version="$(sed -nE 's/.*-v([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' Formula/gbat.rb | head -n 1)"
            fi
            if [[ -z "$current_version" ]]; then
              echo "Existing Formula/gbat.rb has no version" >&2
              exit 1
            fi
            newest_version="$(printf '%s\n' "$current_version" "$VERSION" | sort -V | tail -n 1)"
            if [[ "$current_version" != "$VERSION" && "$newest_version" = "$current_version" ]]; then
              echo "Refusing to replace newer Formula $current_version with $VERSION" >&2
              exit 1
            fi
          fi

          install -m 0644 ../formula/gbat.rb Formula/gbat.rb

          status_paths="$(git status --porcelain=v1 --untracked-files=all | awk '{ print $2 }' | LC_ALL=C sort -u)"
          if [[ -n "$status_paths" && "$status_paths" != "Formula/gbat.rb" ]]; then
            echo "Unexpected Homebrew tap changes:" >&2
            git status --short >&2
            exit 1
          fi

          git add Formula/gbat.rb
          if git diff --cached --quiet; then
            echo "Formula/gbat.rb is already current"
            exit 0
          fi

          git diff --cached --check
          test "$(git diff --cached --name-only)" = "Formula/gbat.rb"
          git diff --cached -- Formula/gbat.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update gbat to $VERSION"
          git push origin HEAD:main
