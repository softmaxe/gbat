[package]
name = "gbat"
version = "0.0.2"
edition = "2021"
description = "Read Logitech GPW2 battery status on macOS and Linux"
license = "AGPL-3.0-only"
repository = "https://github.com/softmaxe/gbat"

[target.'cfg(not(target_os = "linux"))'.dependencies]
hidapi = { version = "2.6.7", features = ["macos-shared-device"] }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native-basic-udev"] }

# Trade release build time for a smaller standalone CLI.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
