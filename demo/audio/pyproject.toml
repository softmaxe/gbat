[project]
name = "gbat-audio"
version = "0.1.0"
description = "Procedural music and sound cues for the gbat explainer film."
requires-python = ">=3.13,<3.14"
dependencies = ["numpy==2.5.3"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gbat_audio"]

[dependency-groups]
dev = ["pytest==9.1.1", "fonttools[woff]==4.61.1"]
